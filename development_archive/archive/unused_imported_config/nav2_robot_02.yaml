/robot_02/map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
    topic_name: map
    frame_id: map
/robot_02/amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: robot_02/base_footprint
    odom_frame_id: robot_02/odom
    global_frame_id: map
    tf_broadcast: true
    transform_tolerance: 1.0
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.1
    max_beams: 80
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.0
    update_min_a: 0.0
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    scan_topic: /robot_02/scan
    set_initial_pose: false
    always_reset_initial_pose: false
/robot_02/planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.1
      use_astar: true
      allow_unknown: false
/robot_02/controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.17
      movement_time_allowance: 35.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.25
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      primary_controller: nav2_mppi_controller::MPPIController
      angular_dist_threshold: 0.17
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 1.0
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      motion_model: DiffDrive
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.2
      vx_max: 0.25
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.8
      ax_max: 0.7
      ax_min: -0.7
      ay_max: 0.0
      az_max: 1.0
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      visualize: false
      regenerate_noises: false
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 20
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
/robot_02/bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: robot_02/base_footprint
    odom_topic: /robot_02/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    default_nav_to_pose_bt_xml: ''
    always_reload_bt_xml: false
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
/robot_02/behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: map
    robot_base_frame: robot_02/base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    behavior_plugins:
    - wait
    wait:
      plugin: nav2_behaviors::Wait
/robot_02/velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.25
    - 0.0
    - 0.8
    min_velocity:
    - 0.0
    - 0.0
    - -0.8
    max_accel:
    - 0.7
    - 0.0
    - 1.0
    max_decel:
    - -0.7
    - 0.0
    - -1.0
    odom_topic: /robot_02/odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 0.5
/robot_02/collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: robot_02/base_footprint
    odom_frame_id: robot_02/odom
    cmd_vel_in_topic: cmd_vel_semantic
    cmd_vel_out_topic: cmd_vel
    transform_tolerance: 0.2
    source_timeout: 0.5
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    polygons:
    - PolygonStop
    - PolygonSlow
    PolygonStop:
      type: polygon
      points: '[[0.65,0.35],[0.65,-0.35],[-0.42,-0.35],[-0.42,0.35]]'
      action_type: stop
      min_points: 3
      visualize: false
    PolygonSlow:
      type: polygon
      points: '[[1.1,0.55],[1.1,-0.55],[-0.6,-0.55],[-0.6,0.55]]'
      action_type: slowdown
      min_points: 3
      slowdown_ratio: 0.3
      visualize: false
    observation_sources:
    - scan
    scan:
      type: scan
      topic: /robot_02/scan
/robot_02/local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 7.0
      publish_frequency: 3.0
      global_frame: robot_02/odom
      robot_base_frame: robot_02/base_footprint
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.28
      always_send_full_costmap: true
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot_02/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          raytrace_max_range: 5.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.38
        cost_scaling_factor: 3.0
/robot_02/global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: robot_02/base_footprint
      resolution: 0.05
      robot_radius: 0.28
      track_unknown_space: true
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /robot_02/scan
          data_type: LaserScan
          clearing: true
          marking: true
          obstacle_max_range: 5.0
          raytrace_max_range: 5.0
          obstacle_min_range: 0.1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.42
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
