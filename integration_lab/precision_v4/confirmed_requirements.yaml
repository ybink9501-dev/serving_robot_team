robot_operation:
  low_speed_mps: 0.1
  normal_speed_mps: 0.15
  high_speed_mps: 0.2
  reverse_allowed: false
  acceleration_mps2: 0.25
  deceleration_mps2: 0.4
  mppi_max_forward_mps: 0.25
  mppi_max_turn_radps: 0.8
  in_place_turn_target_radps: 0.5
  linear_accel_mps2_team_proposal: 0.4
  linear_decel_mps2_team_proposal: 0.4
  soft_stop_mps2_team_proposal: 0.3
  acceleration_mps2_user_later: 0.25
  deceleration_mps2_user_later: 0.4
arrival:
  nav2_xy_goal_tolerance_m: 0.0025
  detection_radius_m: 0.005
  final_xy_error_m: 0.001
  nav2_yaw_tolerance_rad: 0.25
obstacle_policy:
  front_detection_m: 5.0
  front_slow_start_m: 3.0
  front_stop_m: 1.0
  side_stop_m: 1.0
  rear_stop_m: 1.0
  noncontact_pause_s: 1.5
  contact_pause_s: 3.0
  stationary_person_replan_s: 3.0
  front_deceleration_rule: linear from 3 m to 1 m; older alternative v=0.15*d/5 conflicts
    and is NOT silently applied
  front_person_slow_m_team: 1.5
  front_person_stop_m_team: 0.8
  side_person_slow_m_team: 0.8
  hard_stop_clearance_m_team: 0.1
  front_clear_for_resume_m_team: 1.0
  front_clear_hold_s_team: 2.0
  collision_lock_release_s_team: 3.0
  front_detection_m_user_additional: 5.0
  front_slow_start_m_user_additional: 3.0
  front_stop_m_user_additional: 1.0
status:
  lidar_5m: REQUIREMENT_NOT_VERIFIED_BY_SENSOR
  obstacle_policy: NOT_FULLY_IMPLEMENTED_IN_AVAILABLE_ZIP
  final_accuracy: NOT_GAZEBO_VERIFIED
  team_safety_live_unverified: NOT_APPLIED_TO_RUNTIME
source_priority: team_contract > later_user_confirmed_only_where_team_unspecified
  > preserve_existing_if_unspecified
