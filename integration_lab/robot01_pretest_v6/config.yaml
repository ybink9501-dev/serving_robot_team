schema_version: 1
robot_id: robot_01
ros_domain_id: 99
# Only existing TEAM/LAB data; never point at private/individual café workspaces.
serving_v3_dir: ~/team_robot_lab/serving_v3
runtime_limits_yaml: ~/team_robot_lab/config/common/runtime_limits.yaml
arrival_yaml: ~/team_serving_robot/ros_ws/src/serving_robot_navigation/config/arrival.yaml
speed:
  max_linear_mps: 0.25
  max_angular_radps: 0.80
  default_profile: normal
  profiles:
    low: 0.10
    normal: 0.15
    high: 0.20
  # Existing Nav2 controller speed_limit topic (confirmed on Robot 01)
  topic: /robot_01/speed_limit
monitor:
  odom_record_interval_s: 0.5
  no_progress_window_s: 12.0
  minimum_progress_m: 0.08
  excessive_rotation_without_progress_rad: 3.141593
