# Robot01 LAB v3. Project source: ~/team_serving_robot/.../cafe.world.sdf
# Modify the SDF for moved furniture; run prepare.py again. No robot code edits.
schema_version: 3
robot_id: robot_01
map_revision: 2
world_file: ~/team_serving_robot/ros_ws/src/serving_robot_gazebo/worlds/cafe.world.sdf
map_file: ~/team_robot_lab/lab_maps/generated/cafe_full_provisional.yaml
# Current LAB map was generated directly from this SDF. A future SLAM map
# needs its own explicitly reviewed world -> map transform before activation.
frame_alignment:
  mode: sdf_aligned_lab_only
  world_to_map: {x: 0.0, y: 0.0, yaw: 0.0}
geometry:
  robot_clearance_radius_m: 0.35
  sampling_grid_step_m: 0.05
  kitchen_model: cafe_counter
  pickup_offset_local_m: [0.0, -0.95]  # face the counter; not a verified team pickup coordinate
  tables:
    table_01: table_set_01
    table_02: table_set_02
    table_03: table_set_03
    table_04: table_set_04
  # Offsets are applied to the furniture's OWN orientation; relocation and rotation follow SDF.
  table_approaches:
    top: {offset_local_m: [0.0, 0.95], enabled: true}
    bottom: {offset_local_m: [0.0, -0.95], enabled: true}
    left: {offset_local_m: [-1.35, 0.0], enabled: false, reason: chairs_block_service_face}
    right: {offset_local_m: [1.35, 0.0], enabled: false, reason: chairs_block_service_face}
serving:
  completion_mode: manual  # manual or auto LAB-only
  auto_handover_wait_s: 10.0
  loading_mode: manual  # require explicit load confirmation; auto is LAB-only
  auto_loading_wait_s: 10.0
  approach_selection: shortest_planned_path
  planner_timeout_s: 12.0
  active_goal_timeout_s: 240.0
